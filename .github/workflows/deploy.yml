name: Déploiement FTP

on:
  push:
    branches: [main]

# Un seul déploiement à la fois
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoyer sur le serveur
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer par FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # FTPS explicite (port 21). Passer à "ftp" seulement si le serveur n'a pas de TLS.
          port: 21
          local-dir: ./
          server-dir: public_html/BiodivCompar/
          # config.php n'est pas dans le dépôt : il n'est donc jamais envoyé ni écrasé ni supprimé sur le serveur.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .gitignore
            .gh_token
            .essai
            install.php
            config.example.php
            LISEZMOI.txt
            *.zip
